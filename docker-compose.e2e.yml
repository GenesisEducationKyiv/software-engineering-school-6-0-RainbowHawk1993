services:
  e2e-tests:
    build:
      context: ./tests/e2e
      dockerfile: Dockerfile.e2e
    depends_on:
      app:
        condition: service_healthy
    network_mode: "service:app"
    environment:
      BASE_URL: "http://localhost:8080"

  app:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      API_KEY: "test-api-key-12345"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/releases_e2e?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      APP_BASE_URL: "http://localhost:8080"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: releases_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d releases_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - e2e-network

  mailpit:
    image: axllent/mailpit:v1.24
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge
